kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
  extraPortMappings:
  - containerPort: 30300
    hostPort: 3000 # Grafana
  - containerPort: 30800
    hostPort: 8080 # Container Resource Exporter
  - containerPort: 30900
    hostPort: 9090 # Prometheus
  - containerPort: 30820
    hostPort: 8200 # OpenBao (openbao-0)
  - containerPort: 30821
    hostPort: 8201 # OpenBao (openbao-1)
  - containerPort: 30822
    hostPort: 8202 # OpenBao (openbao-2)
  extraMounts:
  - hostPath: ./
    containerPath: /host
    readOnly: true
