# Container resource exporter configuration

server:
  # Listen address and port
  address: ":8080"

paths:
  # Path to cgroup v2 directory
  cgroup: "/sys/fs/cgroup"

  # Path to proc directory
  proc: "/proc"

  # Path to container runtime CRI socket. If commented out, the exporter will search common paths.
  # cri_socket: "/run/containerd/containerd.sock"

# How often to collect metrics
scrape_interval: "1s"

# Logging level: debug, info, warn, error, none
log_level: "info"

# List of containers to collect metrics from. If any filter matches, the container is monitored.
filters:
  # Match all containers in the default namespace
  - namespace: "default"
    pod: "*"
    container: "*"
    command: "*"

  # Match coredns pods in the kube-system namespace
  - namespace: "kube-system"
    pod: "coredns-*"
    container: "*"
    command: "*"

  # Collect sizes of matching files inside the container
  - namespace: "my-namespace"
    pod: "my-pod-*"
    container: "my-container"
    command: "*"
    file_metrics:
      paths:
        - "/var/log/app.log"
        - "/data/*.db"
        - "/data/**/*.tmp"

  # Collect disk space of specific mountpoints inside the container
  - namespace: "my-namespace"
    pod: "my-pod-*"
    container: "my-container"
    command: "*"
    disk_metrics:
      mountpoints:
        - "/data"
        - "/cache"
